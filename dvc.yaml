
stages:
  extract_corpus:
    cmd: >-
      uv run --locked civil-code-extract data/raw/egyption-low.pdf
      --json data/processed/egyptian_civil_code.json
      --markdown data/processed/egyptian_civil_code.md
    deps:
      - data/raw/egyption-low.pdf
      - src/egyptian_civil_code_rag/extraction.py
      - pyproject.toml
      - uv.lock
    outs:
      - data/processed/egyptian_civil_code.json
      - data/processed/egyptian_civil_code.md

  build_chunks:
    cmd: uv run --locked python scripts/build_chunks.py
    deps:
      - data/processed/egyptian_civil_code.json
      - scripts/build_chunks.py
    outs:
      - data/processed/rag_chunks.json

  build_embeddings:
    cmd: uv run --locked python scripts/build_embedding.py
    deps:
      - data/processed/rag_chunks.json
      - scripts/build_embedding.py
    outs:
      - data/processed/embeddings.npy

  build_faiss:
    cmd: uv run --locked python scripts/build_faiss.py
    deps:
      - data/processed/embeddings.npy
      - data/processed/rag_chunks.json
      - scripts/build_faiss.py
    outs:
      - data/processed/civil_code.faiss
      - data/processed/chunk_ids.json