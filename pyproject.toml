[project]
name = "egyptian-civil-code-rag"
version = "0.1.0"
description = "Article-level bilingual Egyptian Civil Code RAG experiment"
readme = "README.md"
authors = [
    { name = "Mahmoud Abdelhamid" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pymupdf>=1.26,<2",
]

[project.scripts]
civil-code-extract = "egyptian_civil_code_rag.extraction:main"

[project.optional-dependencies]
dvc = [
    "dvc[s3]>=3,<4",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
