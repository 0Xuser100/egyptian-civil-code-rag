
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: egyptian-civil-code-rag:0.1.0
    container_name: egyptian-rag-api
    env_file:
      - .env.langfuse
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  ollama:
    image: ollama/ollama:latest
    container_name: egyptian-rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: ["serve"]

volumes:
  ollama_data:
